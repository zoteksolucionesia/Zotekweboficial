<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug - Clientes API</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
        pre { background: #2d2d2d; padding: 15px; border-radius: 5px; overflow-x: auto; }
        .demo { color: #4ec9b0; }
        .normal { color: #ce9178; }
        button { padding: 10px 20px; margin: 10px 0; cursor: pointer; background: #0e639c; color: white; border: none; border-radius: 3px; }
        button:hover { background: #1177bb; }
    </style>
</head>
<body>
    <h1>🔍 Debug - API /api/clients</h1>
    <button onclick="fetchClients()">📡 Llamar a /api/clients</button>
    <button onclick="clearResults()">🗑️ Limpiar</button>
    
    <h2>Respuesta de la API:</h2>
    <pre id="output">Presiona "Llamar a /api/clients" para ver los datos...</pre>
    
    <h2>Análisis de phone_number_id:</h2>
    <pre id="analysis">Esperando datos...</pre>

    <script>
        async function fetchClients() {
            const token = localStorage.getItem('zotek_token');
            const output = document.getElementById('output');
            const analysis = document.getElementById('analysis');
            
            output.textContent = 'Cargando...';
            analysis.textContent = '';
            
            try {
                const response = await fetch('/api/clients', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const clients = await response.json();
                
                // Mostrar respuesta completa
                output.textContent = JSON.stringify(clients, null, 2);
                
                // Analizar phone_number_id
                let analysisHtml = `Total de clientes: ${clients.length}\n\n`;
                
                clients.forEach((client, index) => {
                    const phoneId = client.phone_number_id || '❌ SIN phone_number_id';
                    const isDemo = String(phoneId).startsWith('demo_');
                    const className = isDemo ? 'demo' : 'normal';
                    const demoMarker = isDemo ? '✅ DEMO' : '📁 NORMAL';
                    
                    analysisHtml += `${index + 1}. ${client.name}\n`;
                    analysisHtml += `   ID: ${client.id}\n`;
                    analysisHtml += `   phone_number_id: ${phoneId}\n`;
                    analysisHtml += `   ${demoMarker}\n\n`;
                });
                
                // Contar demos
                const demoCount = clients.filter(c => String(c.phone_number_id || '').startsWith('demo_')).length;
                analysisHtml += `\n========================\n`;
                analysisHtml += `Clientes DEMO detectados: ${demoCount}\n`;
                analysisHtml += `Esperados: 3 (demo_restaurante, demo_clinica, demo_tienda)\n`;
                
                analysis.textContent = analysisHtml;
                
            } catch (error) {
                output.textContent = `❌ Error: ${error.message}`;
                analysis.textContent = 'No se pudieron obtener los datos';
            }
        }
        
        function clearResults() {
            document.getElementById('output').textContent = 'Presiona "Llamar a /api/clients" para ver los datos...';
            document.getElementById('analysis').textContent = 'Esperando datos...';
        }
    </script>
</body>
</html>
