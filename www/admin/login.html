<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zotek Admin | Ingresar</title>

    <!-- Tema: usa la elección guardada o la preferencia del sistema (igual que la landing) -->
    <script>
        (function() {
            var theme = 'light';
            try {
                var saved = localStorage.getItem('zotek-theme');
                if (saved === 'dark' || saved === 'light') {
                    theme = saved;
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    theme = 'dark';
                }
            } catch (e) {}
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tokens de marca, fondo de manchas, botones y logo (compartidos con la landing) -->
    <link rel="stylesheet" href="/landing.css?v=4.0">

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden; /* Oculta el desborde de las manchas de fondo */
        }

        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 1.5rem;
        }

        .login-card {
            background: var(--glass-bg);
            -webkit-backdrop-filter: var(--glass-blur);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 2.8rem 2.4rem;
            text-align: center;
            box-shadow: var(--glass-shadow);
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-login {
            margin-bottom: 1.6rem;
            display: inline-block;
        }
        .logo-login .logo-svg { height: 56px; }

        .login-title {
            margin-bottom: 0.5rem;
            font-size: 1.6rem;
        }

        .login-subtitle {
            color: var(--color-muted-foreground);
            margin-bottom: 2.2rem;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.4rem;
            text-align: left;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--color-foreground);
            font-size: 0.9rem;
            font-weight: 700;
        }

        .form-control {
            width: 100%;
            min-height: 52px;
            padding: 0.9rem 1.2rem;
            background: var(--glass-bg-strong);
            border: 1px solid var(--color-border);
            border-radius: 14px;
            color: var(--color-foreground);
            font-family: 'DM Sans', system-ui, sans-serif;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--color-ring);
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--color-ring) 22%, transparent);
        }

        .form-control::placeholder {
            color: var(--color-muted-foreground);
            opacity: 0.8;
        }

        .btn-submit {
            width: 100%;
            min-height: 52px;
            margin-top: 0.8rem;
            font-size: 1.05rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: wait;
            transform: none;
            box-shadow: none;
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .hidden {
            display: none;
        }

        .error-msg {
            background: rgba(220, 38, 38, 0.10);
            color: #B91C1C;
            padding: 0.8rem;
            border-radius: 12px;
            margin-bottom: 1.4rem;
            font-size: 0.9rem;
            border: 1px solid rgba(220, 38, 38, 0.25);
        }

        .success-msg {
            background: rgba(4, 120, 87, 0.10);
            color: #047857;
            padding: 0.8rem;
            border-radius: 12px;
            margin-bottom: 1.4rem;
            font-size: 0.9rem;
            border: 1px solid rgba(4, 120, 87, 0.25);
        }

        [data-theme="dark"] .error-msg { color: #FCA5A5; background: rgba(248, 113, 113, 0.12); border-color: rgba(248, 113, 113, 0.30); }
        [data-theme="dark"] .success-msg { color: #6EE7B7; background: rgba(52, 211, 153, 0.12); border-color: rgba(52, 211, 153, 0.30); }

        @media (max-width: 480px) {
            .login-card { padding: 2.2rem 1.5rem; }
        }
    </style>
</head>

<body>
    <!-- Fondo de manchas de color (definido en landing.css) -->
    <div class="bg-blobs" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <div class="login-wrapper">
        <div class="login-card">

            <a href="/" class="logo-login" style="text-decoration: none;" aria-label="ZØtek Soluciones - inicio">
                <svg class="logo-svg" viewBox="0 0 340 80" aria-hidden="true">
                    <text x="0" y="40" class="t">ZØtek</text>
                    <text x="120" y="40" class="t">Soluciones</text>
                    <g transform="translate(320,30)">
                        <circle r="10" cx="0" cy="0" class="dot circle-main"/>
                        <g class="dot-group">
                            <circle r="3" cx="-12" cy="-12" class="dot" fill-opacity="0.6"/>
                            <circle r="3" cx="12" cy="-12" class="dot" fill-opacity="0.6"/>
                            <circle r="3" cx="-12" cy="12" class="dot" fill-opacity="0.6"/>
                            <circle r="3" cx="12" cy="12" class="dot" fill-opacity="0.6"/>
                        </g>
                        <line x1="-12" y1="-12" x2="0" y2="0" class="ln"/>
                        <line x1="12" y1="-12" x2="0" y2="0" class="ln"/>
                        <line x1="-12" y1="12" x2="0" y2="0" class="ln"/>
                        <line x1="12" y1="12" x2="0" y2="0" class="ln"/>
                    </g>
                </svg>
            </a>

            <h1 class="login-title font-display text-gradient">Bienvenido</h1>
            <p class="login-subtitle">Ingresa tus credenciales para administrar tus agentes.</p>

            <div id="feedback" class="hidden" role="alert"></div>

            <div id="step-1">
                <div class="form-group">
                    <label class="form-label" for="email">Correo Institucional</label>
                    <input type="email" id="email" class="form-control" placeholder="admin@zotek.ai" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Contraseña Segura</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" autocomplete="current-password" required onkeypress="handleEnter(event)">
                </div>
                <!-- Remove verification step, use direct login -->
                <button class="btn-primary btn-submit" id="btnContinue" onclick="login(this)">
                    Ingresar al Panel
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        function showFeedback(msg, isError = true) {
            const el = document.getElementById('feedback');
            el.textContent = msg;
            el.className = isError ? 'error-msg' : 'success-msg';
            el.classList.remove('hidden');
        }

        function handleEnter(e) {
            if (e.key === 'Enter') {
                login(document.querySelector('.btn-primary'));
            }
        }

        async function login(btn) {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showFeedback('Ingresa tu correo y contraseña.', true);
                return;
            }

            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Verificando...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    showFeedback('Acceso concedido. Redirigiendo...', false);
                    localStorage.setItem('zotek_token', data.access_token);
                    setTimeout(() => {
                        window.location.href = '/admin-control';
                    }, 500);
                } else {
                    showFeedback(data.detail || 'Credenciales incorrectas.', true);
                }
            } catch (e) {
                showFeedback('Error de conexión. ¿El servidor está corriendo?', true);
            } finally {
                btn.disabled = false;
                btn.textContent = originalText;
            }
        }
    </script>
</body>

</html>
