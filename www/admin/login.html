<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zotek Admin | Ingresar</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Link to the main stylesheet for the awesome background effects and base styles -->
    <link rel="stylesheet" href="/style.css">
    
    <style>
        /* Specific overrides for the login form */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden; /* Hide scrollbars from background blobs */
        }
        
        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 2rem;
        }

        .login-card {
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 
                        0 0 0 1px rgba(255, 255, 255, 0.05);
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-login {
            margin-bottom: 2rem;
            display: inline-block;
        }
        
        .login-title {
            margin-bottom: 0.5rem;
            font-size: 1.5rem;
        }
        
        .login-subtitle {
            color: #8892b0;
            margin-bottom: 2.5rem;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }
        
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: #ccd6f6;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 1rem 1.25rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(0, 229, 255, 0.05);
            box-shadow: 0 0 0 4px rgba(0, 229, 255, 0.1);
        }

        .form-control::placeholder {
            color: #64748b;
        }

        .btn-submit {
            width: 100%;
            padding: 1.25rem;
            margin-top: 1rem;
            font-size: 1.05rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .hidden {
            display: none;
        }

        .error-msg {
            background: rgba(255, 123, 114, 0.1);
            color: #ff7b72;
            padding: 0.8rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 123, 114, 0.2);
        }

        .success-msg {
            background: rgba(126, 231, 135, 0.1);
            color: #7ee787;
            padding: 0.8rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            border: 1px solid rgba(126, 231, 135, 0.2);
        }
    </style>
</head>

<body>
    <!-- Background Animated Blobs (from style.css) -->
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="login-wrapper">
        <div class="login-card">
            
            <a href="/" style="text-decoration: none;">
                <img src="/Logo-zotek_animado.svg" alt="Zotek Logo" class="logo-login" style="height: 60px;">
            </a>

            <h1 class="login-title font-display text-gradient">Bienvenido</h1>
            <p class="login-subtitle">Ingresa tus credenciales para administrar tus agentes.</p>

            <div id="feedback" class="hidden"></div>

            <div id="step-1">
                <div class="form-group">
                    <label class="form-label" for="email">Correo Institucional</label>
                    <input type="email" id="email" class="form-control" placeholder="admin@zotek.ai" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Contraseña Segura</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required onkeypress="handleEnter(event)">
                </div>
                <!-- Remove verification step, use direct login -->
                <button class="btn-primary btn-submit" id="btnContinue" onclick="login(this)">
                    Ingresar al Panel
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        function showFeedback(msg, isError = true) {
            const el = document.getElementById('feedback');
            el.textContent = msg;
            el.className = isError ? 'error-msg' : 'success-msg';
            el.classList.remove('hidden');
        }

        function handleEnter(e) {
            if (e.key === 'Enter') {
                login(document.querySelector('.btn-primary'));
            }
        }

        async function login(btn) {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                showFeedback('Ingresa tu correo y contraseña.', true);
                return;
            }

            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Verificando...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                
                if (res.ok) {
                    showFeedback('Acceso concedido. Redirigiendo...', false);
                    localStorage.setItem('zotek_token', data.access_token);
                    setTimeout(() => {
                        window.location.href = '/admin-control';
                    }, 500);
                } else {
                    showFeedback(data.detail || 'Credenciales incorrectas.', true);
                }
            } catch (e) {
                showFeedback('Error de conexión. ¿El servidor está corriendo?', true);
            } finally {
                btn.disabled = false;
                btn.textContent = originalText;
            }
        }
    </script>
</body>

</html>
