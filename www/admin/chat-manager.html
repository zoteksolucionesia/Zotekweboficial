<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Chats - Zotek IA</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a2e; color: #fff; }
        .card { background: #16213e; border-radius: 8px; padding: 20px; margin: 20px 0; }
        .chat-item { background: #0f3460; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .chat-message { margin: 10px 0; padding: 10px; border-left: 3px solid #e94560; }
        .chat-response { margin: 10px 0; padding: 10px; border-left: 3px solid #4ade80; background: rgba(74,222,128,0.1); }
        button { background: #e94560; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin: 5px; }
        button:hover { background: #ff6b6b; }
        button.success { background: #4ade80; }
        button.success:hover { background: #22c55e; }
        button.warning { background: #fbbf24; color: #000; }
        button.warning:hover { background: #f59e0b; }
        select, input { padding: 10px; border-radius: 5px; border: 1px solid #0f3460; background: #1a1a2e; color: #fff; margin: 5px; }
        .stats { display: flex; gap: 20px; margin: 20px 0; }
        .stat-card { background: #0f3460; padding: 20px; border-radius: 8px; flex: 1; text-align: center; }
        .stat-number { font-size: 2em; font-weight: bold; color: #4ade80; }
        pre { background: #0f3460; padding: 15px; border-radius: 5px; overflow-x: auto; white-space: pre-wrap; }
        .empty-state { text-align: center; padding: 40px; color: #888; }
    </style>
</head>
<body>
    <h1>💬 Gestión de Chats</h1>
    <p>Visualiza, exporta y limpia los chats de los bots (demo y reales)</p>

    <div class="stats">
        <div class="stat-card">
            <div class="stat-number" id="totalChats">-</div>
            <div>Total Chats</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="totalUsers">-</div>
            <div>Usuarios Únicos</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="totalClients">-</div>
            <div>Bots Activos</div>
        </div>
    </div>

    <div class="card">
        <h3>Filtros</h3>
        <select id="clientSelect" onchange="loadChats()">
            <option value="">Cargando clientes...</option>
        </select>
        <input type="number" id="limitInput" value="50" min="10" max="500" onchange="loadChats()" placeholder="Límite">
        <button onclick="loadChats()">🔄 Actualizar</button>
        <button class="warning" onclick="exportChats()">📤 Exportar CSV</button>
        <button class="warning" onclick="clearChats()">🗑️ Vaciar Chats</button>
    </div>

    <div id="chatsContainer">
        <div class="empty-state">Selecciona un bot para ver sus chats</div>
    </div>

    <script>
        const API_BASE = '/api';
        let authToken = localStorage.getItem('zotek_token');
        let currentClientId = null;

        async function loadClients() {
            try {
                const res = await fetch(`${API_BASE}/clients`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const clients = await res.json();
                
                const select = document.getElementById('clientSelect');
                select.innerHTML = '<option value="">-- Selecciona un Bot --</option>';
                
                clients.forEach(client => {
                    const option = document.createElement('option');
                    option.value = client.id;
                    option.textContent = `${client.name} (${client.phone_number_id})`;
                    select.appendChild(option);
                });

                document.getElementById('totalClients').textContent = clients.length;
            } catch (error) {
                console.error('Error loading clients:', error);
            }
        }

        async function loadChats() {
            const clientId = document.getElementById('clientSelect').value;
            const limit = document.getElementById('limitInput').value;
            currentClientId = clientId;

            if (!clientId) {
                document.getElementById('chatsContainer').innerHTML = '<div class="empty-state">Selecciona un bot para ver sus chats</div>';
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/clients/${clientId}/chats?limit=${limit}`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const chats = await res.json();

                const container = document.getElementById('chatsContainer');
                
                if (!chats || chats.length === 0) {
                    container.innerHTML = '<div class="empty-state">No hay chats para este bot</div>';
                    document.getElementById('totalChats').textContent = '0';
                    document.getElementById('totalUsers').textContent = '0';
                    return;
                }

                // Agrupar por usuario
                const chatsByUser = {};
                chats.forEach(chat => {
                    if (!chatsByUser[chat.user_number]) {
                        chatsByUser[chat.user_number] = [];
                    }
                    chatsByUser[chat.user_number].push(chat);
                });

                document.getElementById('totalChats').textContent = chats.length;
                document.getElementById('totalUsers').textContent = Object.keys(chatsByUser).length;

                let html = '<div class="card">';
                
                Object.entries(chatsByUser).forEach(([userNumber, userChats]) => {
                    html += `
                        <div class="chat-item">
                            <h4>📱 ${userNumber}</h4>
                            ${userChats.map(chat => `
                                <div class="chat-message">
                                    <div><strong>Usuario:</strong> ${chat.message || '(sin mensaje)'}</div>
                                    <div class="chat-response"><strong>Bot:</strong> ${chat.response || '(sin respuesta)'}</div>
                                    <small>${chat.timestamp ? new Date(chat.timestamp).toLocaleString() : ''}</small>
                                </div>
                            `).join('')}
                        </div>
                    `;
                });

                html += '</div>';
                container.innerHTML = html;
            } catch (error) {
                console.error('Error loading chats:', error);
                document.getElementById('chatsContainer').innerHTML = `<div class="empty-state error">Error: ${error.message}</div>`;
            }
        }

        function exportChats() {
            if (!currentClientId) {
                alert('Selecciona un bot primero');
                return;
            }

            const limit = document.getElementById('limitInput').value;
            fetch(`${API_BASE}/clients/${currentClientId}/chats?limit=${limit}`, {
                headers: { 'Authorization': `Bearer ${authToken}` }
            })
            .then(res => res.json())
            .then(chats => {
                let csv = 'Usuario,Mensaje,Respuesta,Timestamp\n';
                chats.forEach(chat => {
                    const message = (chat.message || '').replace(/"/g, '""');
                    const response = (chat.response || '').replace(/"/g, '""');
                    csv += `"${chat.user_number}","${message}","${response}","${chat.timestamp || ''}"\n`;
                });

                const blob = new Blob([csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `chats_${currentClientId}_${new Date().toISOString().split('T')[0]}.csv`;
                a.click();
            })
            .catch(error => alert('Error exportando: ' + error.message));
        }

        function clearChats() {
            if (!currentClientId) {
                alert('Selecciona un bot primero');
                return;
            }

            if (!confirm('¿Estás seguro de que deseas vaciar TODOS los chats de este bot? Esta acción no se puede deshacer.')) {
                return;
            }

            fetch(`${API_BASE}/clients/${currentClientId}/clear-chats`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${authToken}` }
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'cleared') {
                    alert('Chats eliminados correctamente');
                    loadChats();
                } else {
                    alert('Error: ' + (data.detail || 'Error desconocido'));
                }
            })
            .catch(error => alert('Error: ' + error.message));
        }

        window.onload = () => {
            if (!authToken) {
                document.body.innerHTML = '<div class="empty-state">No hay token de autenticación. Por favor inicia sesión.</div>';
            } else {
                loadClients();
            }
        };
    </script>
</body>
</html>
