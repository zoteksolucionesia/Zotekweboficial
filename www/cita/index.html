<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Cita | Zotek IA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-page: #f8fafc; /* slate-50 */
            --bg-card: #ffffff;
            --text-main: #0f172a; /* slate-900 */
            --text-muted: #64748b; /* slate-500 */
            --text-light: #94a3b8; /* slate-400 */
            --border-color: #e2e8f0; /* slate-200 */
            --zotek-violet: #7c3aed;
            --zotek-cyan: #0891b2;
            --zotek-gradient: linear-gradient(135deg, #7c3aed 0%, #0891b2 100%);
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            --radius-lg: 1rem;
            --radius-md: 0.75rem;
            --radius-sm: 0.5rem;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-page);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(124, 58, 237, 0.03) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(8, 145, 178, 0.03) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Navbar */
        .navbar {
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
        }

        .navbar-logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-main);
            text-decoration: none;
        }

        .navbar-logo-img {
            height: 36px;
            width: auto;
            display: block;
        }

        /* Main Container */
        .container {
            max-width: 1050px;
            width: 100%;
            margin: 2.5rem auto;
            padding: 0 1.5rem;
            flex-grow: 1;
        }

        .welcome-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 1.5rem;
            letter-spacing: -0.02em;
        }

        /* Layout Grid */
        .appointment-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 2rem;
            align-items: start;
        }

        @media (max-width: 820px) {
            .appointment-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            .welcome-title {
                text-align: center;
            }
        }

        /* Cards Style */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        /* Columna Izquierda: Detalles de Cita */
        .apt-header-banner {
            background: var(--zotek-gradient);
            color: #ffffff;
            padding: 2rem;
            position: relative;
        }

        .apt-reserva-id {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            opacity: 0.85;
            margin-bottom: 0.5rem;
        }

        .apt-datetime-main {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 1.25rem;
            letter-spacing: -0.01em;
        }

        .apt-banner-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn-banner-link {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            opacity: 0.9;
            transition: opacity 0.2s, transform 0.2s;
            border-bottom: 1px dashed rgba(255,255,255,0.6);
            padding-bottom: 1px;
            cursor: pointer;
        }

        .btn-banner-link:hover {
            opacity: 1;
            transform: translateY(-1px);
        }

        .btn-banner-link svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        /* Cuerpo Cita */
        .apt-body {
            padding: 2rem;
        }

        /* Botón de Cancelar Cita */
        .btn-cancel-wrapper {
            margin-bottom: 2rem;
        }

        .btn-cancel {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.625rem 1.25rem;
            background-color: #f1f5f9; /* slate-100 */
            color: #475569; /* slate-600 */
            border: 1px solid var(--border-color);
            border-radius: 9999px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-cancel:hover:not(:disabled) {
            background-color: #fee2e2; /* red-100 */
            color: #ef4444; /* red-500 */
            border-color: #fca5a5; /* red-300 */
        }
        
        .btn-cancel:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Sección de Detalles Servicio */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            text-transform: uppercase;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 1.25rem;
        }

        .section-header svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
            color: var(--text-light);
        }

        .service-row {
            display: flex;
            gap: 1.25rem;
            align-items: center;
            margin-bottom: 2rem;
        }

        .service-icon-box {
            width: 60px;
            height: 60px;
            border-radius: var(--radius-sm);
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1px solid var(--border-color);
        }

        .service-icon-box svg {
            width: 30px;
            height: 30px;
            fill: var(--zotek-violet);
        }

        .service-info {
            flex-grow: 1;
        }

        .service-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.25rem;
        }

        .service-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.15rem;
        }

        .service-provider {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .service-price {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            text-align: right;
            white-space: nowrap;
        }

        /* Resumen de Pago */
        .payment-summary {
            padding-top: 1.5rem;
            border-top: 1px dashed var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.5rem;
        }

        .total-row {
            display: flex;
            align-items: baseline;
            gap: 1rem;
        }

        .total-label {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .total-amount {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .payment-status-badge {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #ef4444; /* red-500 */
            text-transform: uppercase;
        }

        .payment-status-badge.paid {
            color: #10b981; /* emerald-500 */
        }

        /* Columna Derecha: Información de Negocio */
        .business-body {
            padding: 2rem;
        }

        .biz-profile {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .biz-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--zotek-gradient);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: var(--shadow-sm);
        }

        .biz-info-header {
            flex-grow: 1;
        }

        .biz-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.25;
            margin-bottom: 0.15rem;
        }

        .biz-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .biz-details-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .biz-detail-item {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .biz-detail-item svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
            color: var(--text-light);
            flex-shrink: 0;
            margin-top: 0.1rem;
        }

        .biz-detail-item a {
            color: var(--zotek-violet);
            text-decoration: none;
            font-weight: 500;
        }

        .biz-detail-item a:hover {
            text-decoration: underline;
        }

        /* Mapa */
        .map-wrapper {
            width: 100%;
            height: 200px;
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--border-color);
            margin-bottom: 1.5rem;
            background-color: #f1f5f9;
        }

        .map-wrapper iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Contactar WhatsApp */
        .btn-whatsapp-block {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.875rem 1rem;
            background-color: #25d366;
            color: #ffffff;
            text-decoration: none;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.9rem;
            transition: background-color 0.2s, transform 0.2s;
            box-shadow: 0 2px 4px rgba(37, 211, 102, 0.2);
        }

        .btn-whatsapp-block:hover {
            background-color: #20ba5a;
            transform: translateY(-1px);
        }

        .btn-whatsapp-block svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Badges de Cita Estado */
        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .badge-pending   { background: #eff6ff; color: #3b82f6; border: 1px solid #bfdbfe; }
        .badge-confirmed { background: #ecfdf5; color: #10b981; border: 1px solid #a7f3d0; }
        .badge-cancelled { background: #fef2f2; color: #ef4444; border: 1px solid #fca5a5; }
        .badge-completed { background: #f5f3ff; color: #7c3aed; border: 1px solid #ddd6fe; }

        /* Skeleton Loading */
        .skeleton {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 0.25rem;
            height: 1rem;
            display: inline-block;
        }

        @keyframes shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 2.5rem 1.5rem;
            font-size: 0.8rem;
            color: var(--text-light);
            border-top: 1px solid var(--border-color);
            background-color: #ffffff;
            margin-top: auto;
        }

        .footer a {
            color: var(--zotek-violet);
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .footer-contact {
            margin-top: 0.4rem;
            font-size: 0.78rem;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.4);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            z-index: 100;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.active { display: flex; }

        .modal {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2rem;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: var(--shadow-lg);
        }

        .modal-icon {
            font-size: 2.5rem;
            margin-bottom: 0.75rem;
            display: inline-block;
        }

        .modal h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.5rem;
            letter-spacing: -0.01em;
        }

        .modal p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .modal-actions {
            display: flex;
            gap: 0.75rem;
        }

        .modal-actions button {
            flex: 1;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #475569;
            border: 1px solid var(--border-color);
        }
        .btn-secondary:hover { background: #e2e8f0; }

        .btn-danger {
            background: #ef4444;
            color: #ffffff;
        }
        .btn-danger:hover:not(:disabled) { background: #dc2626; }
        .btn-danger:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: #10b981;
            color: #ffffff;
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            z-index: 200;
            pointer-events: none;
            box-shadow: var(--shadow-lg);
        }
        .toast.show { opacity: 1; transform: translate(-50%, -0.5rem); }
        .toast.error { background: #ef4444; }

        /* Error States */
        .error-state {
            text-align: center;
            padding: 3rem 1.5rem;
        }

        .error-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .error-state h2 {
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .error-state p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        .btn-retry {
            display: inline-flex;
            padding: 0.625rem 1.25rem;
            background: var(--zotek-gradient);
            color: #ffffff;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .btn-retry:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    
    <nav class="navbar">
        <a href="https://zotek-ia.web.app" class="navbar-logo" target="_blank" aria-label="Zotek IA">
            <img src="/Logo-zotek_animado.svg" alt="Zotek Soluciones IA" class="navbar-logo-img" />
        </a>
    </nav>

    <div class="container">
        <h1 class="welcome-title" id="welcome-title">Cargando detalles...</h1>

        <div class="appointment-grid">
            
            <!-- Columna Izquierda: Cita -->
            <div class="card" id="apt-card">
                <!-- Banner de cabecera -->
                <div class="apt-header-banner">
                    <div class="apt-reserva-id" id="apt-reserva-id">
                        <span class="skeleton" style="width: 100px;"></span>
                    </div>
                    <div class="apt-datetime-main" id="apt-datetime-main">
                        <span class="skeleton" style="width: 250px; height: 1.8rem;"></span>
                    </div>
                    <div class="apt-banner-actions" id="apt-banner-actions">
                        <span class="skeleton" style="width: 120px;"></span>
                        <span class="skeleton" style="width: 100px; margin-left: 10px;"></span>
                    </div>
                </div>

                <!-- Cuerpo de detalles -->
                <div class="apt-body">
                    <!-- Botón de cancelar -->
                    <div class="btn-cancel-wrapper" id="btn-cancel-wrapper">
                        <span class="skeleton" style="width: 150px; height: 2.2rem; border-radius: 9999px;"></span>
                    </div>

                    <!-- Detalles del servicio -->
                    <div class="section-header">
                        <span>Detalles Servicio</span>
                        <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
                    </div>

                    <div class="service-row" id="service-row">
                        <div class="service-icon-box">
                            <svg viewBox="0 0 24 24">
                                <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/>
                            </svg>
                        </div>
                        <div class="service-info">
                            <div class="service-title" id="service-title">
                                <span class="skeleton" style="width: 180px; height: 1.2rem;"></span>
                            </div>
                            <div class="service-meta" id="service-meta">
                                <span class="skeleton" style="width: 120px;"></span>
                            </div>
                            <div class="service-provider" id="service-provider">
                                <span class="skeleton" style="width: 150px;"></span>
                            </div>
                        </div>
                        <div class="service-price" id="service-price">
                            <span class="skeleton" style="width: 80px; height: 1.2rem;"></span>
                        </div>
                    </div>

                    <!-- Resumen de pago -->
                    <div class="payment-summary" id="payment-summary">
                        <div class="total-row">
                            <span class="total-label">Total</span>
                            <span class="total-amount" id="total-amount">
                                <span class="skeleton" style="width: 90px; height: 1.5rem;"></span>
                            </span>
                        </div>
                        <div class="payment-status-badge" id="payment-status">
                            <span class="skeleton" style="width: 120px;"></span>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Columna Derecha: Negocio -->
            <div class="card" id="biz-card">
                <div class="business-body">
                    
                    <div class="biz-profile">
                        <div class="biz-avatar" id="biz-avatar">...</div>
                        <div class="biz-info-header">
                            <div class="biz-name" id="biz-name">
                                <span class="skeleton" style="width: 180px; height: 1.1rem;"></span>
                            </div>
                            <div class="biz-subtitle" id="biz-subtitle">
                                <span class="skeleton" style="width: 100px;"></span>
                            </div>
                        </div>
                    </div>

                    <div class="biz-details-list">
                        <div class="biz-detail-item" id="biz-email-item">
                            <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                            <span id="biz-email">
                                <span class="skeleton" style="width: 160px;"></span>
                            </span>
                        </div>
                        <div class="biz-detail-item" id="biz-address-item">
                            <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                            <div>
                                <span id="biz-address">
                                    <span class="skeleton" style="width: 200px;"></span>
                                </span>
                                <div style="margin-top: 0.25rem;" id="biz-map-link-wrapper"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Wrapper del Mapa -->
                    <div class="map-wrapper" id="map-wrapper">
                        <div class="skeleton" style="width: 100%; height: 100%; border-radius: 0;"></div>
                    </div>

                    <!-- Botón WhatsApp -->
                    <div id="biz-whatsapp-wrapper">
                        <span class="skeleton" style="width: 100%; height: 2.8rem; border-radius: var(--radius-md);"></span>
                    </div>

                </div>
            </div>

        </div>

        <div id="error-container"></div>
    </div>

    <footer class="footer">
        Gestionado por <a href="https://zotek-ia.web.app" target="_blank">Zotek IA</a>
        <div class="footer-contact">Contacto: <a href="mailto:zoteksolucionesia@gmail.com">zoteksolucionesia@gmail.com</a></div>
    </footer>

    <!-- Confirmación Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <span class="modal-icon">⚠️</span>
            <h2>¿Cancelar esta cita?</h2>
            <p>Esta acción no se puede deshacer. Si quieres reagendar, deberás crear una nueva cita.</p>
            <div class="modal-actions">
                <button class="btn-secondary" id="modal-cancel">Volver</button>
                <button class="btn-danger" id="modal-confirm">Sí, cancelar</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="cita.js?v=2.0.2"></script>
</body>
</html>
