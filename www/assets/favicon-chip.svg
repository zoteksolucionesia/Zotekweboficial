<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Chip del logo Zotek (estático) centrado y a buen tamaño -->
  <g transform="translate(32,32)">
    <!-- Líneas que conectan el centro con cada punto -->
    <g stroke="#00bcd4" stroke-width="2" stroke-opacity="0.55">
      <line x1="-20" y1="-20" x2="0" y2="0"/>
      <line x1="20"  y1="-20" x2="0" y2="0"/>
      <line x1="-20" y1="20"  x2="0" y2="0"/>
      <line x1="20"  y1="20"  x2="0" y2="0"/>
    </g>
    <!-- Puntos rosados -->
    <g fill="#ff0066" fill-opacity="0.85">
      <circle r="5.5" cx="-20" cy="-20"/>
      <circle r="5.5" cx="20"  cy="-20"/>
      <circle r="5.5" cx="-20" cy="20"/>
      <circle r="5.5" cx="20"  cy="20"/>
    </g>
    <!-- Círculo central cyan -->
    <circle r="15" cx="0" cy="0" fill="#00bcd4"/>
  </g>
</svg>
